<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5a623">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CLJ Roulette">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<title>Clapham Junction — Where Next?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #0a0c0f;
    --board: #0f1318;
    --amber: #f5a623;
    --amber-dim: #7a5312;
    --green: #2ecc71;
    --blue: #3498db;
    --purple: #9b59b6;
    --text: #c8cdd6;
    --muted: #4a5060;
    --border: #1e2530;
    --row-hover: #141921;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Inter', sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bot);
  }

  /* ── HEADER ── */
  header {
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .station-name {
    font-family: var(--mono);
    font-size: clamp(18px, 5vw, 28px);
    color: var(--amber);
    letter-spacing: 0.04em;
    line-height: 1;
  }

  .station-sub {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .live-clock {
    font-family: var(--mono);
    font-size: 22px;
    color: var(--amber);
    margin-left: auto;
    letter-spacing: 0.08em;
  }

  /* ── CONTROLS ── */
  .controls {
    flex-shrink: 0;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-btn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 7px 11px;
    border-radius: 4px;
    border: 1px solid var(--muted);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    touch-action: manipulation;
    min-height: 36px;
  }

  .filter-btn.active { color: var(--bg); border-color: transparent; }
  .filter-btn[data-op="all"].active    { background: var(--amber); }
  .filter-btn[data-op="SWR"].active    { background: var(--green); }
  .filter-btn[data-op="Southern"].active { background: var(--blue); }
  .filter-btn[data-op="Overground"].active { background: var(--purple); }

  .spin-btn {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 8px 16px;
    background: var(--amber);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    font-weight: bold;
    transition: opacity 0.15s;
    touch-action: manipulation;
    min-height: 36px;
  }
  .spin-btn:active { opacity: 0.7; }

  .search-row {
    flex-shrink: 0;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
  }

  .search-box {
    font-family: var(--mono);
    font-size: 14px;
    background: var(--board);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 4px;
    width: 100%;
    outline: none;
    letter-spacing: 0.04em;
  }
  .search-box:focus { border-color: var(--amber-dim); }
  .search-box::placeholder { color: var(--muted); }

  /* ── PICK DISPLAY ── */
  #pick-display {
    display: none;
    flex-shrink: 0;
    margin: 10px 16px;
    padding: 12px 14px;
    background: var(--board);
    border: 1px solid var(--amber-dim);
    border-radius: 6px;
    font-family: var(--mono);
  }
  #pick-display.visible { display: flex; align-items: center; gap: 12px; }
  .pick-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .pick-dest  { font-size: clamp(18px, 5vw, 26px); color: var(--amber); letter-spacing: 0.04em; }
  .pick-op    { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .pick-time  { font-size: 10px; margin-left: auto; color: var(--muted); text-align: right; white-space: nowrap; }

  /* ── SCROLLABLE TABLE ── */
  .board-wrap {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 16px 16px;
  }

  .count-line {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    padding: 8px 0 6px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
  }

  thead th {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: left;
    padding: 6px 8px 6px 0;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 26px;
    background: var(--bg);
    z-index: 1;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.08s;
  }
  tbody tr:active { background: var(--row-hover); }
  tbody tr.highlighted { background: #1c1700; }

  td {
    padding: 11px 8px 11px 0;
    font-size: 14px;
    vertical-align: middle;
  }
  td:first-child { padding-left: 4px; }

  .dest-name { color: #e8eaf0; font-size: 15px; }

  .op-badge {
    display: inline-block;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 2px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .op-SWR        { background: #0d3320; color: var(--green); }
  .op-Southern   { background: #0b2240; color: var(--blue); }
  .op-Overground { background: #1e1040; color: var(--purple); }

  .region-tag { font-size: 10px; color: var(--muted); }

  .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 7px;
    vertical-align: middle;
    flex-shrink: 0;
  }
  .dot-SWR        { background: var(--green); }
  .dot-Southern   { background: var(--blue); }
  .dot-Overground { background: var(--purple); }

  #no-results {
    display: none;
    font-family: var(--mono);
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.06em;
  }

  /* install banner */
  #install-banner {
    display: none;
    flex-shrink: 0;
    background: #1a1200;
    border-bottom: 1px solid var(--amber-dim);
    padding: 10px 16px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--amber);
    align-items: center;
    gap: 12px;
  }
  #install-banner.show { display: flex; }
  #install-btn {
    margin-left: auto;
    background: var(--amber);
    color: var(--bg);
    border: none;
    padding: 5px 12px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 0.06em;
    touch-action: manipulation;
  }
  #dismiss-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }
</style>
</head>
<body>

<div id="install-banner">
  <span>📲 Add to Home Screen for the full app experience</span>
  <button id="install-btn">Install</button>
  <button id="dismiss-btn">×</button>
</div>

<header>
  <div>
    <div class="station-sub">London — Departure Board</div>
    <div class="station-name">CLAPHAM JUNCTION</div>
  </div>
  <div class="live-clock" id="clock">00:00:00</div>
</header>

<div class="controls">
  <button class="filter-btn active" data-op="all">All</button>
  <button class="filter-btn" data-op="SWR">SWR</button>
  <button class="filter-btn" data-op="Southern">Southern</button>
  <button class="filter-btn" data-op="Overground">Overground</button>
  <button class="spin-btn" id="spin-btn">🎲 Pick one</button>
</div>

<div class="search-row">
  <input class="search-box" type="search" id="search" placeholder="Search destination or region…" autocomplete="off" autocorrect="off" spellcheck="false">
</div>

<div id="pick-display">
  <div>
    <div class="pick-label">Your next adventure</div>
    <div class="pick-dest" id="pick-dest">—</div>
    <div class="pick-op"   id="pick-op">—</div>
  </div>
  <div class="pick-time" id="pick-time"></div>
</div>

<div class="board-wrap">
  <div class="count-line" id="count-line"></div>
  <table>
    <thead>
      <tr>
        <th style="width:45%">Destination</th>
        <th style="width:22%">Operator</th>
        <th style="width:33%">Region</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="no-results">No destinations match</div>
</div>

const seen = new Set();
const DESTS = DESTINATIONS.filter(d => {
  const k = d.name + d.op;
  if (seen.has(k)) return false;
  seen.add(k); return true;
});

let currentFilter = 'all';
let currentSearch = '';
let highlighted = null;

function getFiltered() {
  return DESTS.filter(d => {
    const opOk = currentFilter === 'all' || d.op === currentFilter;
    const q = currentSearch.toLowerCase();
    const srchOk = !q || d.name.toLowerCase().includes(q) || d.region.toLowerCase().includes(q);
    return opOk && srchOk;
  });
}

function render() {
  const filtered = getFiltered();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  document.getElementById('count-line').textContent =
    `${filtered.length} destination${filtered.length !== 1 ? 's' : ''}`;

  const noRes = document.getElementById('no-results');
  if (!filtered.length) { noRes.style.display = 'block'; return; }
  noRes.style.display = 'none';

  const frag = document.createDocumentFragment();
  filtered.forEach(d => {
    const tr = document.createElement('tr');
    if (highlighted && highlighted.name === d.name && highlighted.op === d.op)
      tr.classList.add('highlighted');
    tr.innerHTML = `
      <td class="dest-name"><span class="dot dot-${d.op}"></span>${d.name}</td>
      <td><span class="op-badge op-${d.op}">${d.op}</span></td>
      <td class="region-tag">${d.region}</td>`;
    frag.appendChild(tr);
  });
  tbody.appendChild(frag);
}

// Clock
function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-GB', { hour12: false });
}
tick(); setInterval(tick, 1000);

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.op;
    highlighted = null; hidePick(); render();
  });
});

// Search
document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value;
  highlighted = null; hidePick(); render();
});

// Spin
document.getElementById('spin-btn').addEventListener('click', () => {
  const filtered = getFiltered();
  if (!filtered.length) return;
  highlighted = filtered[Math.floor(Math.random() * filtered.length)];
  showPick(highlighted); render();
  setTimeout(() => {
    const row = document.querySelector('#tbody tr.highlighted');
    if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 60);
});

function showPick(d) {
  document.getElementById('pick-dest').textContent = d.name;
  document.getElementById('pick-op').textContent = `${d.op} · ${d.region}`;
  const t = new Date();
  t.setMinutes(t.getMinutes() + Math.floor(Math.random() * 18 + 3));
  document.getElementById('pick-time').textContent =
    `~${t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`;
  document.getElementById('pick-display').classList.add('visible');
}
function hidePick() {
  document.getElementById('pick-display').classList.remove('visible');
}

// PWA install prompt
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').classList.remove('show');
});
document.getElementById('dismiss-btn').addEventListener('click', () => {
  document.getElementById('install-banner').classList.remove('show');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').classList.remove('show');
});

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(console.warn);
}

render();
</script>
</body>
</html>
